services:
  - type: web
    name: market-risk-volatility-dashboard
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && pip install .
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
